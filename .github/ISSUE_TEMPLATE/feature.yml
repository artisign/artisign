name: Feature request
description: A design problem the tool does not solve yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The problem is more useful than a proposed solution — describe what you were trying to do and where the tool got in the way.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What were you trying to do, and what stopped you?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution (optional)
      description: If you have one. A tool, a parameter, a preview behaviour, …
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Workarounds you tried or other ways this could be solved.
