name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines` promises and the current LTS. Without the floor,
        # nothing checks that the package actually runs on the oldest Node it
        # claims to support. Each driver protocol gets its own browser run:
        # Chrome exercises the CDP adapter, Firefox the WebDriver BiDi one —
        # both come preinstalled on the Ubuntu runner (ADR-007).
        include:
          - { node-version: "22.4.0", browser: google-chrome }
          - { node-version: "24", browser: google-chrome }
          - { node-version: "24", browser: firefox }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The auto-commit tests drive real `git commit` against throwaway repos,
      # and a bare runner has no committer identity — without this they all
      # fail with `sha: null`.
      - name: Give git a committer identity
        run: |
          git config --global user.name "artisign CI"
          git config --global user.email "ci@artisign.dev"

      - run: npm ci

      # The screenshot and inspect-node suites skip themselves when no browser
      # is found — a green run that never touched the browser path. Pinning
      # the browser here makes `npm test` an actual gate for both protocols,
      # and fails loudly if the runner image ever drops it.
      - name: Pin the browser under test
        run: |
          browser="$(command -v ${{ matrix.browser }})" || { echo "::error::${{ matrix.browser }} is not installed on this runner"; exit 1; }
          echo "ARTISIGN_BROWSER=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Give git a committer identity
        run: |
          git config --global user.name "artisign CI"
          git config --global user.email "ci@artisign.dev"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # CHR-1081: the run above uses whichever browser discovery picks first
      # (Chrome). These steps run the browser e2e files once per remaining
      # browser: Edge over CDP, Firefox over WebDriver BiDi.
      - name: Screenshot and inspect-node e2e with Edge
        if: always()
        shell: pwsh
        run: |
          $exe = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $exe)) { $exe = Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe' }
          if (-not (Test-Path $exe)) { throw 'msedge.exe not found' }
          Write-Host "ARTISIGN_BROWSER=$exe"
          $env:ARTISIGN_BROWSER = $exe
          npx vitest run src/tools/screenshot.test.ts src/tools/inspect-node.test.ts src/tools/browser.test.ts
      - name: No Edge process or profile left behind
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          # Only processes started with one of our temp profiles count; the runner has unrelated msedge processes.
          $left = @(Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" | Where-Object { $_.CommandLine -like '*artisign-browser-profiles*' })
          $profiles = @(Get-ChildItem (Join-Path $HOME 'artisign-browser-profiles') -ErrorAction SilentlyContinue)
          Write-Host "msedge processes: $($left.Count), profile dirs: $($profiles.Count)"
          if ($left.Count -gt 0 -or $profiles.Count -gt 0) { throw 'leftover msedge process or artisign profile directory' }
      - name: Screenshot and inspect-node e2e with Firefox
        if: always()
        shell: pwsh
        run: |
          $exe = Join-Path $env:ProgramFiles 'Mozilla Firefox\firefox.exe'
          if (-not (Test-Path $exe)) { $exe = Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\firefox.exe' }
          if (-not (Test-Path $exe)) { throw 'firefox.exe not found' }
          Write-Host "ARTISIGN_BROWSER=$exe"
          $env:ARTISIGN_BROWSER = $exe
          npx vitest run src/tools/screenshot.test.ts src/tools/inspect-node.test.ts src/tools/browser.test.ts
      - name: No Firefox process or profile left behind
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          # Only processes started with one of our temp profiles count; the runner has unrelated firefox processes.
          $left = @(Get-CimInstance Win32_Process -Filter "Name = 'firefox.exe'" | Where-Object { $_.CommandLine -like '*artisign-browser-profiles*' })
          $profiles = @(Get-ChildItem (Join-Path $HOME 'artisign-browser-profiles') -ErrorAction SilentlyContinue)
          Write-Host "firefox processes: $($left.Count), profile dirs: $($profiles.Count)"
          if ($left.Count -gt 0 -or $profiles.Count -gt 0) { throw 'leftover firefox process or artisign profile directory' }
