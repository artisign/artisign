name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines` promises and the current LTS. Without the floor,
        # nothing checks that the package actually runs on the oldest Node it
        # claims to support. Each driver protocol gets its own browser run:
        # Chrome exercises the CDP adapter, Firefox the WebDriver BiDi one —
        # both come preinstalled on the Ubuntu runner (ADR-007).
        include:
          - { node-version: "22.4.0", browser: google-chrome }
          - { node-version: "24", browser: google-chrome }
          - { node-version: "24", browser: firefox }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The auto-commit tests drive real `git commit` against throwaway repos,
      # and a bare runner has no committer identity — without this they all
      # fail with `sha: null`.
      - name: Give git a committer identity
        run: |
          git config --global user.name "Artisign CI"
          git config --global user.email "ci@artisign.dev"

      - run: npm ci

      # The screenshot and inspect-node suites skip themselves when no browser
      # is found — a green run that never touched the browser path. Pinning
      # the browser here makes `npm test` an actual gate for both protocols,
      # and fails loudly if the runner image ever drops it.
      - name: Pin the browser under test
        run: |
          browser="$(command -v ${{ matrix.browser }})" || { echo "::error::${{ matrix.browser }} is not installed on this runner"; exit 1; }
          echo "ARTISIGN_BROWSER=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
