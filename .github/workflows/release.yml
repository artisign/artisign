name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but publish nothing"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The auto-commit tests drive real `git commit` against throwaway repos,
      # and a bare runner has no committer identity — without this they all
      # fail with `sha: null`.
      - name: Give git a committer identity
        run: |
          git config --global user.name "Artisign CI"
          git config --global user.email "ci@artisign.dev"

      # npm trusted publishing (OIDC, no stored token) needs npm >= 11.5.1;
      # the npm bundled with Node 22 predates it. Pinned to that major: a tag
      # is immutable, so a breaking npm release must not be able to strand one.
      # No `registry-url` on setup-node either — its .npmrc expects a
      # NODE_AUTH_TOKEN we do not have.
      - run: npm install -g npm@^11.5.1

      # A manual run publishes nothing: real releases come from a tag, which is
      # what pins the version and gives `gh release create` something to attach to.
      - name: Refuse a manual publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          echo "::error::A real publish runs from a v* tag, not from workflow_dispatch."
          exit 1

      - name: Resolve the version
        id: version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version."
              exit 1
            fi
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Same reason as in ci.yml: without Playwright the browser-backed suites
      # skip, and the publish gate would be green without ever launching one.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Prints the tarball contents for the release log. It asserts nothing —
      # read the listing when a release changes what ships.
      - run: npm publish --dry-run

      # Written outside the workspace so it cannot slip into the tarball and
      # make the real publish differ from the dry run above.
      - name: Extract the release notes
        run: npx tsx scripts/changelog-section.ts "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      # Before the publish, and idempotent: a GitHub Release can be deleted, an
      # npm version cannot. Doing it the other way round means a failure here
      # leaves the version live on npm with no release, and the re-run dies on
      # "cannot publish over previously published version".
      - name: Create the GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "Artisign v${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Publish to npm
        if: inputs.dry_run != true
        run: npm publish --provenance
