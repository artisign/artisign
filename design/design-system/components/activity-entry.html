<div id="entry" style="display: flex; align-items: center; gap: $spacing.md; padding: $spacing.sm $spacing.lg; border-bottom: 1px solid var(--chrome-border); cursor: pointer">
  <span id="entry-mark" style="flex: none; width: 8px; height: 8px; border-radius: $radius.pill; background: var(--chrome-activity-read)"></span>
  <span id="entry-body" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
    <span id="entry-tool-wrap" style="font-family: $typography.family-code; font-size: $typography.ui-xs; color: var(--chrome-text)"><span data-slot="tool"></span></span>
    <span id="entry-target-wrap" style="font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="target"></span></span>
  </span>
  <span id="entry-time-wrap" style="flex: none; font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="time"></span></span>
</div><template data-variant="write"><div id="entry" style="display: flex; align-items: center; gap: $spacing.md; padding: $spacing.sm $spacing.lg; border-bottom: 1px solid var(--chrome-border); cursor: pointer">
  <span id="entry-mark" style="flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--chrome-activity-write)"></span>
  <span id="entry-body" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
    <span id="entry-tool-wrap" style="font-family: $typography.family-code; font-size: $typography.ui-xs; color: var(--chrome-text)"><span data-slot="tool"></span></span>
    <span id="entry-target-wrap" style="font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="target"></span></span>
  </span>
  <span id="entry-time-wrap" style="flex: none; font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="time"></span></span>
</div></template><template data-variant="error"><div id="entry" style="display: flex; align-items: center; gap: $spacing.md; padding: $spacing.sm $spacing.lg 9px; border-bottom: 1px solid var(--chrome-border); background: rgba(185,28,28,0.05); border-left: 3px solid var(--chrome-error); cursor: default">
  <span class="icon" id="entry-mark" style="flex: none; width: auto; height: 14px; border-radius: $radius.pill; background: var(--chrome-error); color: var(--chrome-primary-text); font-size: $size.icon-sm; line-height: 14px; text-align: center">close</span>
  <span id="entry-body" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
    <span id="entry-tool-wrap" style="font-family: $typography.family-code; font-size: $typography.ui-xs; color: var(--chrome-error)"><span data-slot="tool"></span></span>
    <span id="entry-target-wrap" style="font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="target"></span></span>
  </span>
  <span id="entry-time-wrap" style="flex: none; font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="time"></span></span>
</div></template><template data-variant="deleted"><div id="entry" style="display: flex; align-items: center; gap: $spacing.md; padding: $spacing.sm $spacing.lg; border-bottom: 1px solid var(--chrome-border); opacity: 0.5; cursor: default">
  <span id="entry-mark" style="flex: none; width: 8px; height: 8px; border-radius: $radius.pill; background: var(--chrome-text-tertiary)"></span>
  <span id="entry-body" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
    <span id="entry-tool-wrap" style="font-family: $typography.family-code; font-size: $typography.ui-xs; color: var(--chrome-text)"><span data-slot="tool"></span></span>
    <span id="entry-target-wrap" style="font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary); font-style: italic">target removed</span>
  </span>
  <span id="entry-time-wrap" style="flex: none; font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="time"></span></span>
</div></template>
