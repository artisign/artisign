<div id="board-toolbar" style="flex: none; display: flex; align-items: center; gap: $spacing.lg; padding: $spacing.sm $spacing.xl; height: 40px; border-bottom: 1px solid var(--chrome-border); background: var(--chrome-bar)">

  <span id="bt-divider" style="width: 1px; height: 20px; background: var(--chrome-field)"></span>

  <span id="bt-edges" style="display: flex; align-items: center; gap: $spacing.xs; border: 1px solid var(--chrome-border-strong); border-radius: $radius.sm; padding: $spacing.sm 10px; font-size: $typography.ui-sm; color: var(--chrome-accent); background: var(--chrome-accent-subtle); font-weight: $typography.weight-medium; white-space: nowrap">Edges: On</span>
