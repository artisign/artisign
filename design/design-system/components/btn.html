<button type="button" id="btn" style="display:inline-flex;align-items:center;justify-content:center;gap:$spacing.sm;height:$size.field-lg;padding:0 $spacing.xl;border:0;border-radius:$radius.pill;background:var(--chrome-raised);box-shadow:var(--chrome-shadow-raised);color:var(--chrome-text);font:inherit;font-size:$typography.ui-base;font-weight:$typography.weight-medium;white-space:nowrap;flex:none"><span data-slot="label">Cancel</span></button>
<template data-variant="confirm"><button type="button" id="btn" style="display:inline-flex;align-items:center;justify-content:center;gap:$spacing.sm;height:$size.field-lg;padding:0 $spacing.xl;border:0;border-radius:$radius.pill;background:var(--chrome-primary);color:var(--chrome-primary-text);font:inherit;font-size:$typography.ui-base;font-weight:$typography.weight-semibold;white-space:nowrap;flex:none"><span data-slot="label">Open</span></button></template>
<template data-variant="confirm-disabled"><button type="button" id="btn" aria-disabled="true" style="display:inline-flex;align-items:center;justify-content:center;gap:$spacing.sm;height:$size.field-lg;padding:0 $spacing.xl;border:0;border-radius:$radius.pill;background:var(--chrome-field);color:var(--chrome-text-tertiary);font:inherit;font-size:$typography.ui-base;font-weight:$typography.weight-semibold;white-space:nowrap;flex:none"><span data-slot="label">Open</span></button></template>
<template data-variant="ghost"><button type="button" id="btn" style="display:inline-flex;align-items:center;justify-content:center;gap:$spacing.sm;height:$size.field-lg;padding:0 $spacing.lg;border:0;border-radius:$radius.pill;background:none;color:var(--chrome-text-secondary);font:inherit;font-size:$typography.ui-base;font-weight:$typography.weight-medium;white-space:nowrap;flex:none"><span data-slot="label">Download</span></button></template>
