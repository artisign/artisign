<div id="cvf" style="position:relative;border-radius:$radius.frame;overflow:hidden;background:#ffffff;box-shadow:var(--chrome-shadow-frame)"><div id="cvf-inner" style="width:100%;height:100%"><span data-slot="content"></span></div></div>
<template data-variant="selected"><div id="cvf" aria-current="true" style="position:relative;border-radius:$radius.frame;overflow:hidden;background:#ffffff;box-shadow:0 0 0 2px var(--chrome-accent), var(--chrome-shadow-frame)"><div id="cvf-inner" style="width:100%;height:100%"><span data-slot="content"></span></div></div></template>
<template data-variant="writing"><div id="cvf" style="position:relative;border-radius:$radius.frame;overflow:hidden;background:#ffffff;box-shadow:0 0 0 2px var(--chrome-agent), var(--chrome-shadow-frame)"><div id="cvf-inner" style="width:100%;height:100%"><span data-slot="content"></span></div></div></template>
