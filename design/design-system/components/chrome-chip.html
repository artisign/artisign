<span id="c" style="display:inline-flex;align-items:center;height:$size.chip-h;padding:0 $spacing.sm;border-radius:$radius.pill;background:var(--chrome-field);color:var(--chrome-text-secondary);font-size:$typography.ui-chip;white-space:nowrap"><span data-slot="label"></span></span>
<template data-variant="on-selected"><span id="c" style="display:inline-flex;align-items:center;height:$size.chip-h;padding:0 $spacing.sm;border-radius:$radius.pill;background:var(--chrome-raised);color:var(--chrome-text-secondary);font-size:$typography.ui-chip;white-space:nowrap"><span data-slot="label"></span></span></template>
<template data-variant="hit"><span id="c" style="display:inline-flex;align-items:center;height:$size.chip-h;padding:0 $spacing.sm;border-radius:$radius.pill;background:var(--chrome-accent-subtle);color:var(--chrome-accent);font-size:$typography.ui-chip;font-weight:$typography.weight-medium;white-space:nowrap"><span data-slot="label"></span></span></template>
<template data-variant="more"><span id="c" style="display:inline-flex;align-items:center;height:$size.chip-h;padding:0 $spacing.sm;border-radius:$radius.pill;border:1px dashed var(--chrome-border-strong);color:var(--chrome-text-tertiary);font-size:$typography.ui-chip;white-space:nowrap"><span data-slot="label"></span></span></template>
<template data-variant="ref"><span id="c" style="display:inline-flex;align-items:center;height:$size.chip-h;padding:0 $spacing.sm;border-radius:$radius.pill;background:var(--chrome-field);color:var(--chrome-text-secondary);font-family:$typography.family-code;font-size:$typography.ui-chip;white-space:nowrap"><span data-slot="label"></span></span></template>
<template data-variant="token"><span id="c" style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:$radius.pill;background:var(--chrome-raised);border:1px solid var(--chrome-border);color:var(--chrome-text-secondary);font-family:$typography.family-code;font-size:$typography.ui-chip;white-space:nowrap"><span data-slot="label"></span></span></template>
<template data-variant="token-hit"><span id="c" style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:$radius.pill;background:var(--chrome-accent-subtle);color:var(--chrome-accent);font-family:$typography.family-code;font-size:$typography.ui-chip;white-space:nowrap"><span data-slot="label"></span></span></template>
