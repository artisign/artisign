<div id="cf" style="display:flex;align-items:center;gap:$spacing.md;height:36px;padding:0 $spacing.xs 0 $spacing.lg;border-radius:$radius.sm;border:1px solid var(--chrome-border);background:var(--chrome-field)"><span id="cf-code" style="flex:1;min-width:0;font-family:$typography.family-code;font-size:12.5px;color:var(--chrome-text)"><span data-slot="code"></span></span><span id="cf-copy" data-component="chrome-icon-btn" data-variant="sm"><span data-slot="icon">content_copy</span></span></div>
<template data-variant="compact"><div id="cf" style="display:inline-flex;align-items:center;gap:$spacing.sm;height:$size.control;padding:0 $spacing.2xs 0 $spacing.md;border-radius:$radius.sm;border:1px solid var(--chrome-border);background:var(--chrome-field)"><span id="cf-code" style="font-family:$typography.family-code;font-size:$typography.ui-sm;color:var(--chrome-text);white-space:nowrap"><span data-slot="code"></span></span><span id="cf-copy" data-component="chrome-icon-btn" data-variant="sm"><span data-slot="icon">content_copy</span></span></div></template>
<template data-variant="block"><div id="cf" style="display:flex;align-items:flex-start;gap:$spacing.md;padding:$spacing.md $spacing.xs $spacing.md $spacing.lg;border-radius:$radius.sm;border:1px solid var(--chrome-border);background:var(--chrome-field)"><span id="cf-code" style="flex:1;min-width:0;padding-top:$spacing.xs;font-family:$typography.family-code;font-size:$typography.ui-sm;line-height:1.5;color:var(--chrome-text);word-break:break-all"><span data-slot="code"></span></span><span id="cf-copy" data-component="chrome-icon-btn" data-variant="sm"><span data-slot="icon">content_copy</span></span></div></template>
