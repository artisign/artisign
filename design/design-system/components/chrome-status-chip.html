<span id="sc" style="display:inline-flex;align-items:center;gap:$spacing.xs;height:20px;padding:0 $spacing.md 0 $spacing.sm;border-radius:$radius.pill;background:color-mix(in srgb, var(--chrome-ok) 14%, transparent);color:var(--chrome-ok);font-size:$typography.ui-2xs;font-weight:$typography.weight-medium;white-space:nowrap;flex:none"><span class="icon" style="font-size:$size.icon-xs;line-height:1">check</span>Connected</span>
<template data-variant="not-connected"><span id="sc" style="display:inline-flex;align-items:center;height:20px;padding:0 $spacing.md;border-radius:$radius.pill;border:1px solid var(--chrome-border-strong);color:var(--chrome-text-secondary);font-size:$typography.ui-2xs;white-space:nowrap;flex:none">Not connected</span></template>
<template data-variant="not-installed"><span id="sc" style="display:inline-flex;align-items:center;height:20px;padding:0 $spacing.md;border-radius:$radius.pill;background:var(--chrome-field);color:var(--chrome-text-tertiary);font-size:$typography.ui-2xs;white-space:nowrap;flex:none">Not installed</span></template>
