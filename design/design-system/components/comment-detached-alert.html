<div id="cda" role="note" style="display: grid; grid-template-columns: auto 1fr; gap: $spacing.xs $spacing.md; margin: $spacing.md $spacing.lg 0; padding: $spacing.md $spacing.pad; border-radius: $radius.sm; background: var(--chrome-warning-subtle); color: var(--chrome-text)"><span id="cda-icon" class="icon" aria-hidden="true" style="font-size: $size.icon-sm; line-height: 1; color: var(--chrome-warning)">warning</span><p id="cda-text" style="margin: 0; line-height: 1.45"><span data-slot="text">This element no longer exists. Move the thread to the element that replaced it, or resolve it.</span></p><span id="cda-action" style="grid-column: 2; justify-self: start"><span data-slot="action"></span></span></div>
