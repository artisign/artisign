<div id="cm" style="padding: $spacing.md $spacing.lg"><div id="cm-meta" style="display: flex; align-items: center; gap: $spacing.sm; margin-bottom: $spacing.xs"><span id="cm-avatar" aria-hidden="true" style="display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; background: $comment.human; color: $comment.on; font-size: 9px; font-weight: 700"><span data-slot="avatar">YO</span></span><b id="cm-name" style="font-weight: $typography.weight-semibold"><span data-slot="name">You</span></b><span id="cm-badge" style="display: inline-flex; align-items: center; height: $size.badge-h; padding: 0 5px; border-radius: $radius.pill; background: alpha($comment.human, 0.12); color: $comment.human; font-size: 10px; font-weight: $typography.weight-semibold; white-space: nowrap">Human</span><span id="cm-time" style="margin-left: auto; color: var(--chrome-text-tertiary); font-size: $typography.ui-2xs"><span data-slot="time">2h</span></span></div><div id="cm-body" style="padding-left: 26px; line-height: 1.5; overflow-wrap: anywhere"><span data-slot="text">Message</span></div></div>
<template data-variant="agent"><div id="cm" style="padding: $spacing.md $spacing.lg"><div id="cm-meta" style="display: flex; align-items: center; gap: $spacing.sm; margin-bottom: $spacing.xs"><span id="cm-avatar" aria-hidden="true" style="display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; background: $comment.agent; color: $comment.on; font-size: 9px; font-weight: 700"><span data-slot="avatar">UX</span></span><b id="cm-name" style="font-weight: $typography.weight-semibold"><span data-slot="name">ux-agent</span></b><span id="cm-badge" style="display: inline-flex; align-items: center; height: $size.badge-h; padding: 0 5px; border-radius: $radius.pill; background: alpha($comment.agent, 0.12); color: $comment.agent; font-size: 10px; font-weight: $typography.weight-semibold; white-space: nowrap">Agent</span><span id="cm-time" style="margin-left: auto; color: var(--chrome-text-tertiary); font-size: $typography.ui-2xs"><span data-slot="time">1h</span></span></div><div id="cm-body" style="padding-left: 26px; line-height: 1.5; overflow-wrap: anywhere"><span data-slot="text">Message</span></div></div></template>
