<div id="cmb" role="status" style="position: absolute; top: $spacing.lg; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: $spacing.md; height: 32px; padding: 0 $spacing.lg; border-radius: $radius.pill; background: $comment.human; color: $comment.on; font-size: $typography.ui-sm; white-space: nowrap; box-shadow: var(--chrome-shadow-float)"><span id="cmb-icon" class="icon" aria-hidden="true" style="font-size: $size.icon-sm; line-height: 1">chat_bubble</span><span id="cmb-label"><span data-slot="label">Comment mode — click an element to start a thread</span></span><kbd id="cmb-kbd" style="border-radius: $radius.xs; background: alpha($comment.on, 0.22); font-size: $typography.ui-2xs; padding: 0 5px; font: inherit">Esc</kbd><span id="cmb-muted" style="opacity: 0.8">to exit</span></div>
