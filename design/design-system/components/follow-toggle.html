<span id="follow-toggle" style="display: inline-flex; align-items: center; gap: $spacing.xs; border: 1px solid $color.border-strong; background: $color.surface; border-radius: $radius.sm; padding: $spacing.sm $spacing.lg; font-size: $typography.size-base; color: $color.text-muted">
  <span id="ft-dot" style="width: 6px; height: 6px; border-radius: $radius.pill; background: $color.text-faint"></span>
  <span id="ft-label">Follow</span>
</span><template data-variant="following"><span id="follow-toggle" style="display: inline-flex; align-items: center; gap: $spacing.xs; border: 1px solid $color.accent; background: $color.accent-subtle; border-radius: $radius.sm; padding: $spacing.sm $spacing.lg; font-size: $typography.size-base; color: $color.accent; font-weight: $typography.weight-semibold">
  <span id="ft-dot" style="width: 6px; height: 6px; border-radius: $radius.pill; background: $color.accent"></span>
  <span id="ft-label">Following</span>
</span></template><template data-variant="paused"><span id="follow-toggle" style="display: inline-flex; align-items: center; gap: $spacing.xs; border: 1px solid $color.warning; background: $color.warning-subtle; border-radius: $radius.sm; padding: $spacing.sm $spacing.lg; font-size: $typography.size-base; color: $color.warning">
  <span id="ft-dot" style="width: 6px; height: 6px; border-radius: $radius.pill; background: $color.warning"></span>
  <span id="ft-label">Follow paused</span>
  <span id="ft-divider" style="width: 1px; align-self: stretch; background: $color.warning; opacity: 0.35"></span>
  <span id="ft-resume" style="color: $color.accent; font-weight: $typography.weight-semibold">Resume</span>
</span></template>
