<span id="kind-icon" style="display: inline-block; position: relative; flex: none; width: 9px; height: 13px; border: 1.5px solid $color.text-tertiary; border-radius: 2px"><span id="ki-lines" style="position: absolute; left: 1px; right: 1px; top: 2px; height: 1.5px; background: $color.text-tertiary; box-shadow: 0 3px 0 $color.text-tertiary"></span></span>
