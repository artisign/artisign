<span id="lc" role="status" title="Live reload: connected" style="display:inline-flex;align-items:center;gap:$spacing.sm;font-size:$typography.ui-xs;font-weight:$typography.weight-semibold;color:var(--chrome-ok);white-space:nowrap;flex:none"><span id="lc-dot" style="width:$size.indicator;height:$size.indicator;border-radius:$radius.pill;background:var(--chrome-ok)"></span>Live</span>
<template data-variant="offline"><span id="lc" role="status" title="Live reload disconnected, retrying" style="display:inline-flex;align-items:center;gap:$spacing.sm;height:20px;padding:0 $spacing.md;border-radius:$radius.pill;background:color-mix(in srgb, var(--chrome-error) 12%, transparent);font-size:$typography.ui-xs;font-weight:$typography.weight-semibold;color:var(--chrome-error);white-space:nowrap;flex:none"><span id="lc-dot" style="width:$size.indicator;height:$size.indicator;border-radius:$radius.pill;background:var(--chrome-error)"></span>Offline</span></template>
