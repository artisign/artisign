<span id="micro-thumb" style="display: inline-block; position: relative; width: 12px; height: 26px; margin-right: 3px; border: 1px solid $color.border-strong; border-radius: 3px; background: $color.surface-hover; overflow: hidden"></span>
<template data-variant="overlay"><span id="micro-thumb" style="display: inline-block; position: relative; width: 12px; height: 26px; margin-right: 3px; border: 1px solid $color.border-strong; border-radius: 3px; background: $color.surface; overflow: hidden"><span id="mt-sheet" style="position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: $color.accent"></span></span></template>
<template data-variant="deeper"><span id="micro-thumb" style="display: inline-block; position: relative; width: 12px; height: 26px; margin-left: 6px; margin-right: 3px; border: 1px dashed $color.border-strong; border-radius: 3px; background: $color.surface; overflow: hidden"></span></template>
