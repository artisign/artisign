<span id="tag-chip" style="display: inline-block; font-size: $typography.size-3xs; line-height: 17px; padding: 0 $spacing.md; border-radius: $radius.pill; background: $color.border; color: $color.text-muted"><span data-slot="label">tag</span></span>
<template data-variant="active">
  <span id="tag-chip" style="display: inline-block; font-size: $typography.size-3xs; line-height: 17px; padding: 0 $spacing.md; border-radius: $radius.pill; background: $color.accent; color: $color.surface; font-weight: $typography.weight-semibold"><span data-slot="label">tag</span></span>
</template>
<template data-variant="ref">
  <span id="tag-chip" style="display: inline-block; font-family: $typography.family-mono; font-size: $typography.size-3xs; line-height: 17px; padding: 0 $spacing.md; border-radius: $radius.pill; background: $color.surface; color: $color.accent"><span data-slot="label">tag</span></span>
</template>
<template data-variant="badge">
  <span id="tag-chip" style="display: inline-block; font-size: $typography.size-3xs; line-height: 17px; padding: 0 $spacing.md; border-radius: $radius.pill; background: $color.accent-subtle; color: $color.accent"><span data-slot="label">tag</span></span>
</template>
