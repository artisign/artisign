<button type="button" id="tl" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:$size.tool;height:$size.tool;padding:0;border:0;border-radius:$radius.item;background:none;color:var(--chrome-text-secondary);flex:none"><span class="icon" id="tl-icon" style="font-size:$size.icon;line-height:1"><span data-slot="icon"></span></span></button>
<template data-variant="hover"><button type="button" id="tl" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:$size.tool;height:$size.tool;padding:0;border:0;border-radius:$radius.item;background:var(--chrome-hover);color:var(--chrome-text);flex:none"><span class="icon" id="tl-icon" style="font-size:$size.icon;line-height:1"><span data-slot="icon"></span></span></button></template>
<template data-variant="pressed"><button type="button" id="tl" aria-pressed="true" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:$size.tool;height:$size.tool;padding:0;border:0;border-radius:$radius.item;background:var(--chrome-primary);color:var(--chrome-primary-text);flex:none"><span class="icon" id="tl-icon" style="font-size:$size.icon;line-height:1"><span data-slot="icon"></span></span></button></template>
<template data-variant="disabled"><button type="button" id="tl" aria-disabled="true" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:$size.tool;height:$size.tool;padding:0;border:0;border-radius:$radius.item;background:none;color:var(--chrome-border-strong);cursor:not-allowed;flex:none"><span class="icon" id="tl-icon" style="font-size:$size.icon;line-height:1"><span data-slot="icon"></span></span></button></template>
<template data-variant="badge"><button type="button" id="tl" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:$size.tool;height:$size.tool;padding:0;border:0;border-radius:$radius.item;background:none;color:var(--chrome-text-secondary);flex:none"><span class="icon" id="tl-icon" style="font-size:$size.icon;line-height:1"><span data-slot="icon"></span></span><b id="tl-badge" aria-hidden="true" style="position:absolute;top:1px;right:0;display:inline-flex;align-items:center;justify-content:center;min-width:$size.chip-h;height:$size.chip-h;padding:0 $spacing.xs;border-radius:$radius.pill;background:var(--chrome-accent);color:var(--chrome-primary-text);font-size:$typography.ui-badge;font-weight:$typography.weight-semibold;line-height:1"><span data-slot="count"></span></b></button></template>
<template data-variant="badge-disabled"><button type="button" id="tl" aria-disabled="true" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:$size.tool;height:$size.tool;padding:0;border:0;border-radius:$radius.item;background:none;color:var(--chrome-border-strong);cursor:not-allowed;flex:none"><span class="icon" id="tl-icon" style="font-size:$size.icon;line-height:1"><span data-slot="icon"></span></span><b id="tl-badge" aria-hidden="true" style="position:absolute;top:1px;right:0;display:inline-flex;align-items:center;justify-content:center;min-width:$size.chip-h;height:$size.chip-h;padding:0 $spacing.xs;border-radius:$radius.pill;background:var(--chrome-border-strong);color:var(--chrome-primary-text);font-size:$typography.ui-badge;font-weight:$typography.weight-semibold;line-height:1"><span data-slot="count"></span></b></button></template>
