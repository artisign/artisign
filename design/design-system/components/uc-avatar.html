<span id="av" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: none; border-radius: $radius.pill; background: var(--avatar-color, var(--chrome-text-tertiary)); box-shadow: 0 0 0 2px var(--chrome-raised); color: #ffffff; font-size: 13px; line-height: 1; font-weight: $typography.weight-semibold"><span data-slot="label"></span></span>
<template data-variant="sm"><span id="av" style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex: none; border-radius: $radius.pill; background: var(--avatar-color, var(--chrome-text-tertiary)); box-shadow: 0 0 0 1.5px var(--chrome-raised); color: #ffffff; font-size: 10px; line-height: 1; font-weight: $typography.weight-semibold"><span data-slot="label"></span></span></template>
<template data-variant="lg"><span id="av" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border-radius: $radius.pill; background: var(--avatar-color, var(--chrome-text-tertiary)); box-shadow: 0 0 0 2px var(--chrome-raised); color: #ffffff; font-size: 21px; line-height: 1; font-weight: $typography.weight-semibold"><span data-slot="label"></span></span></template>
<template data-variant="system"><span id="av" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: none; border-radius: $radius.sm; background: var(--chrome-field); border: 1px solid var(--chrome-border-strong); color: var(--chrome-text-secondary); line-height: 1"><span class="icon" style="font-size: $size.icon-xs; line-height: 1">memory</span></span></template>
