<span id="cc" style="display: inline-flex; align-items: stretch; height: 22px; border-radius: $radius.xs; border: 1px solid var(--chrome-border-strong); background: var(--chrome-raised); font-family: $typography.family-code; font-size: $typography.ui-2xs; overflow: hidden; white-space: nowrap; flex: none; max-width: 100%"><span id="cc-k" style="display: inline-flex; align-items: center; padding: 0 $spacing.sm; background: var(--chrome-field); color: var(--chrome-text-secondary); min-width: 0; overflow: hidden; text-overflow: ellipsis"><span data-slot="key"></span></span><span id="cc-o" style="display: inline-flex; align-items: center; padding: 0 $spacing.xs; color: var(--chrome-text-tertiary); border-left: 1px solid var(--chrome-border); border-right: 1px solid var(--chrome-border)"><span data-slot="op"></span></span><span id="cc-v" style="display: inline-flex; align-items: center; padding: 0 $spacing.sm; font-weight: $typography.weight-medium; color: var(--chrome-text)"><span data-slot="value"></span></span></span>
<template data-variant="warning"><span id="cc" style="display: inline-flex; align-items: stretch; height: 22px; border-radius: $radius.xs; border: 1px solid var(--chrome-warning); background: var(--chrome-warning-subtle); font-family: $typography.family-code; font-size: $typography.ui-2xs; overflow: hidden; white-space: nowrap; flex: none; max-width: 100%"><span id="cc-k" style="display: inline-flex; align-items: center; padding: 0 $spacing.sm; color: var(--chrome-warning); text-decoration: underline wavy; text-underline-offset: 3px; min-width: 0; overflow: hidden; text-overflow: ellipsis"><span data-slot="key"></span></span><span id="cc-o" style="display: inline-flex; align-items: center; padding: 0 $spacing.xs; color: var(--chrome-text-tertiary); border-left: 1px solid var(--chrome-border); border-right: 1px solid var(--chrome-border)"><span data-slot="op"></span></span><span id="cc-v" style="display: inline-flex; align-items: center; padding: 0 $spacing.sm; font-weight: $typography.weight-medium; color: var(--chrome-text)"><span data-slot="value"></span></span></span></template>
<template data-variant="time"><span id="cc" style="display: inline-flex; align-items: center; gap: $spacing.xs; height: 22px; padding: 0 $spacing.sm 0 $spacing.xs; border-radius: $radius.xs; border: 1px solid var(--chrome-border-strong); background: var(--chrome-raised); font-size: $typography.ui-2xs; white-space: nowrap; flex: none"><span id="cc-ic" class="icon" style="font-size: $size.icon-xs; line-height: 1; color: var(--chrome-text-tertiary)">event</span><span id="cc-from" style="color: var(--chrome-text-tertiary)">from</span><span id="cc-v" style="font-family: $typography.family-code; font-weight: $typography.weight-medium; color: var(--chrome-text)"><span data-slot="value"></span></span></span></template>
