<span id="db" style="display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px 0 5px; border-radius: $radius.pill; background: var(--chrome-warning-subtle); color: var(--chrome-warning); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span class="icon" style="font-size: 12px; line-height: 1">edit</span>Changed</span>
<template data-variant="added"><span id="db" style="display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px 0 5px; border-radius: $radius.pill; background: color-mix(in srgb, var(--chrome-ok) 14%, transparent); color: var(--chrome-ok); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span class="icon" style="font-size: 12px; line-height: 1">add</span>Added</span></template>
<template data-variant="removed"><span id="db" style="display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px 0 5px; border-radius: $radius.pill; background: color-mix(in srgb, var(--chrome-danger) 12%, transparent); color: var(--chrome-danger); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span class="icon" style="font-size: 12px; line-height: 1">remove</span>Removed</span></template>
<template data-variant="base"><span id="db" style="display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px 0 5px; border-radius: $radius.pill; border: 1px solid var(--chrome-border-strong); color: var(--chrome-text-tertiary); font-size: $typography.ui-chip; white-space: nowrap; flex: none"><span class="icon" style="font-size: 12px; line-height: 1">check</span>From base</span></template>
<template data-variant="emptied"><span id="db" style="display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px 0 5px; border-radius: $radius.pill; border: 1px dashed var(--chrome-warning); color: var(--chrome-warning); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span class="icon" style="font-size: 12px; line-height: 1">block</span>Emptied</span></template>
