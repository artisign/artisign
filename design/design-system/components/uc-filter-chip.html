<span id="fc" style="display: inline-flex; align-items: center; gap: 2px; height: $size.control-sm; padding: 0 5px 0 $spacing.md; border-radius: $radius.sm; border: 1px solid var(--chrome-border-strong); background: var(--chrome-raised); color: var(--chrome-text-secondary); font-size: $typography.ui-sm; white-space: nowrap; flex: none"><span data-slot="label"></span><span class="icon" style="font-size: $size.icon-xs; line-height: 1; color: var(--chrome-text-tertiary)">expand_more</span></span>
<template data-variant="active"><span id="fc" style="display: inline-flex; align-items: center; gap: 3px; height: $size.control-sm; padding: 0 5px 0 $spacing.md; border-radius: $radius.sm; border: 1px solid transparent; background: var(--chrome-accent-subtle); color: var(--chrome-accent); font-size: $typography.ui-sm; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span data-slot="label"></span><span class="icon" style="font-size: $size.icon-xs; line-height: 1">close</span></span></template>
<template data-variant="open"><span id="fc" style="display: inline-flex; align-items: center; gap: 2px; height: $size.control-sm; padding: 0 5px 0 $spacing.md; border-radius: $radius.sm; border: 1px solid var(--chrome-border-strong); background: var(--chrome-active); color: var(--chrome-text); font-size: $typography.ui-sm; white-space: nowrap; flex: none"><span data-slot="label"></span><span class="icon" style="font-size: $size.icon-xs; line-height: 1; color: var(--chrome-text-secondary)">expand_less</span></span></template>
<template data-variant="toggle"><span id="fc" style="display: inline-flex; align-items: center; gap: 4px; height: $size.control-sm; padding: 0 $spacing.md 0 6px; border-radius: $radius.sm; border: 1px solid var(--chrome-border-strong); background: var(--chrome-raised); color: var(--chrome-text-secondary); font-size: $typography.ui-sm; white-space: nowrap; flex: none"><span class="icon" style="font-size: $size.icon-xs; line-height: 1; color: var(--chrome-text-tertiary)">check_box_outline_blank</span><span data-slot="label"></span></span></template>
<template data-variant="toggle-on"><span id="fc" style="display: inline-flex; align-items: center; gap: 4px; height: $size.control-sm; padding: 0 $spacing.md 0 6px; border-radius: $radius.sm; border: 1px solid transparent; background: var(--chrome-accent-subtle); color: var(--chrome-accent); font-size: $typography.ui-sm; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span class="icon" style="font-size: $size.icon-xs; line-height: 1">check_box</span><span data-slot="label"></span></span></template>
