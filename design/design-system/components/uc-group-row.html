<div id="gr" style="display: flex; align-items: center; gap: $spacing.xs; height: 26px; padding: 0 $spacing.md 0 $spacing.xs; border-radius: $radius.sm; color: var(--chrome-text); font-size: $typography.ui-sm; font-weight: $typography.weight-medium"><span class="icon" style="font-size: $size.icon-xs; line-height: 1; flex: none; color: var(--chrome-text-secondary)">expand_more</span><span class="icon" style="font-size: $size.icon-sm; line-height: 1; flex: none; color: var(--chrome-text-tertiary)">folder_open</span><span id="gr-name" style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><span data-slot="name"></span></span><span id="gr-count" style="font-size: $typography.ui-2xs; font-weight: $typography.weight-regular; color: var(--chrome-text-tertiary); font-variant-numeric: tabular-nums"><span data-slot="count"></span></span></div>
<template data-variant="closed"><div id="gr" style="display: flex; align-items: center; gap: $spacing.xs; height: 26px; padding: 0 $spacing.md 0 $spacing.xs; border-radius: $radius.sm; color: var(--chrome-text-secondary); font-size: $typography.ui-sm; font-weight: $typography.weight-medium"><span class="icon" style="font-size: $size.icon-xs; line-height: 1; flex: none; color: var(--chrome-text-secondary)">chevron_right</span><span class="icon" style="font-size: $size.icon-sm; line-height: 1; flex: none; color: var(--chrome-text-tertiary)">folder</span><span id="gr-name" style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><span data-slot="name"></span></span><span id="gr-count" style="font-size: $typography.ui-2xs; font-weight: $typography.weight-regular; color: var(--chrome-text-tertiary); font-variant-numeric: tabular-nums"><span data-slot="count"></span></span></div></template>
