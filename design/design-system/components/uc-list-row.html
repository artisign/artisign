<div id="lr" style="display: flex; flex-direction: column; gap: 2px; padding: 5px $spacing.md 6px; border-radius: $radius.sm"><div id="lr-title" style="font-size: $typography.ui-base; color: var(--chrome-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span data-slot="title"></span></div><div id="lr-meta" style="display: flex; align-items: center; gap: $spacing.sm; font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary); white-space: nowrap"><span data-slot="meta"></span></div></div>
<template data-variant="selected"><div id="lr" style="display: flex; flex-direction: column; gap: 2px; padding: 5px $spacing.md 6px; border-radius: $radius.sm; background: var(--chrome-active)"><div id="lr-title" style="font-size: $typography.ui-base; font-weight: $typography.weight-medium; color: var(--chrome-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span data-slot="title"></span></div><div id="lr-meta" style="display: flex; align-items: center; gap: $spacing.sm; font-size: $typography.ui-2xs; color: var(--chrome-text-secondary); white-space: nowrap"><span data-slot="meta"></span></div></div></template>
