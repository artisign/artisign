<div id="pc" style="display: flex; flex-direction: column; gap: $spacing.lg; padding: $spacing.xl; border-radius: $radius.md; border: 1px solid var(--chrome-border); background: var(--chrome-raised); height: 100%"><div id="pc-head" style="display: flex; align-items: center; gap: $spacing.lg"><span id="pc-av" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border-radius: $radius.pill; background: var(--avatar-color, var(--chrome-text-tertiary)); color: #ffffff; font-size: 21px; line-height: 1; font-weight: $typography.weight-semibold"><span data-slot="avatar"></span></span><div id="pc-id" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: $spacing.2xs"><span id="pc-name" style="font-size: $typography.ui-md; font-weight: $typography.weight-semibold"><span data-slot="name"></span></span><span id="pc-role" style="font-size: $typography.ui-xs; color: var(--chrome-text-tertiary)"><span data-slot="role"></span></span></div></div><div id="pc-traits" style="display: flex; flex-wrap: wrap; gap: $spacing.xs"><span data-slot="traits"></span></div><div id="pc-goals" style="flex: 1; font-size: $typography.ui-sm; line-height: 1.45; color: var(--chrome-text-secondary)"><span data-slot="goals"></span></div><div id="pc-usage" style="padding-top: $spacing.md; border-top: 1px solid var(--chrome-border); font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="usage"></span></div></div>
<template data-variant="generated"><div id="pc" style="display: flex; flex-direction: column; gap: $spacing.lg; padding: $spacing.xl; border-radius: $radius.md; border: 1px dashed var(--chrome-border-strong); background: var(--chrome-sidebar); height: 100%"><div id="pc-head" style="display: flex; align-items: center; gap: $spacing.lg"><span id="pc-av" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border-radius: $radius.pill; background: var(--avatar-color, var(--chrome-text-tertiary)); color: #ffffff; font-size: $typography.ui-md; line-height: 1; font-weight: $typography.weight-semibold"><span data-slot="avatar"></span></span><div id="pc-id" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: $spacing.2xs"><span id="pc-name" style="font-size: $typography.ui-md; font-weight: $typography.weight-semibold"><span data-slot="name"></span></span><span id="pc-role" style="font-size: $typography.ui-xs; color: var(--chrome-text-tertiary)"><span data-slot="role"></span></span></div><span id="pc-gen" title="Generated from dimensions" style="display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 $spacing.md 0 $spacing.sm; border-radius: $radius.pill; background: var(--chrome-field); color: var(--chrome-text-secondary); font-size: $typography.ui-2xs; flex: none"><span class="icon" style="font-size: $size.icon-xs; line-height: 1">auto_awesome</span>Generated</span></div><div id="pc-traits" style="display: flex; flex-wrap: wrap; gap: $spacing.xs"><span data-slot="traits"></span></div><div id="pc-goals" style="flex: 1; font-size: $typography.ui-sm; line-height: 1.45; color: var(--chrome-text-secondary)"><span data-slot="goals"></span></div><div id="pc-usage" style="padding-top: $spacing.md; border-top: 1px dashed var(--chrome-border-strong); font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="usage"></span></div></div></template>
