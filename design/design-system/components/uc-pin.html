<span id="pin" style="position: relative; display: block; width: 100%; height: 100%; border: 2px solid var(--chrome-accent); border-radius: 3px; background: alpha($chrome-light.accent, 0.08)"><span id="pin-no" style="position: absolute; top: -9px; left: -9px; display: inline-flex; align-items: center; justify-content: center; min-width: $size.icon; height: $size.icon; padding: 0 $spacing.xs; border-radius: $radius.pill; background: var(--chrome-accent); color: #ffffff; font-size: $typography.ui-2xs; font-weight: $typography.weight-semibold; line-height: 1"><span data-slot="label"></span></span></span>
<template data-variant="selected"><span id="pin" style="position: relative; display: block; width: 100%; height: 100%; border: 2px solid var(--chrome-accent); border-radius: 3px; background: alpha($chrome-light.accent, 0.08); box-shadow: 0 0 0 3px alpha($chrome-light.accent, 0.3)"><span id="pin-no" style="position: absolute; top: -9px; left: -9px; display: inline-flex; align-items: center; justify-content: center; min-width: $size.icon; height: $size.icon; padding: 0 $spacing.xs; border-radius: $radius.pill; background: var(--chrome-accent); color: #ffffff; font-size: $typography.ui-2xs; font-weight: $typography.weight-semibold; line-height: 1"><span data-slot="label"></span></span></span></template>
<template data-variant="unstable"><span id="pin" style="position: relative; display: block; width: 100%; height: 100%; border: 2px dashed var(--chrome-accent); border-radius: 3px; background: alpha($chrome-light.accent, 0.08)"><span id="pin-no" style="position: absolute; top: -9px; left: -9px; display: inline-flex; align-items: center; justify-content: center; min-width: $size.icon; height: $size.icon; padding: 0 $spacing.xs; border-radius: $radius.pill; background: var(--chrome-accent); color: #ffffff; font-size: $typography.ui-2xs; font-weight: $typography.weight-semibold; line-height: 1"><span data-slot="label"></span></span></span></template>
<template data-variant="missing"><span id="pin" style="position: relative; display: block; width: 22px; height: 22px; border: 2px dashed var(--chrome-warning); border-radius: $radius.pill; background: var(--chrome-warning-subtle)"><span id="pin-no" style="position: absolute; top: -3px; left: -3px; display: inline-flex; align-items: center; justify-content: center; min-width: $size.icon; height: $size.icon; padding: 0 $spacing.xs; border-radius: $radius.pill; background: var(--chrome-warning); color: #ffffff; font-size: $typography.ui-2xs; font-weight: $typography.weight-semibold; line-height: 1"><span data-slot="label"></span></span></span></template>
<template data-variant="screen"><span id="pin" style="position: relative; display: block; width: 100%; height: 100%; border: 3px solid var(--chrome-accent); border-radius: $radius.md; background: alpha($chrome-light.accent, 0.14)"><span id="pin-no" style="position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; justify-content: center; min-width: $size.icon; height: $size.icon; padding: 0 $spacing.xs; border-radius: $radius.pill; background: var(--chrome-accent); color: #ffffff; font-size: $typography.ui-2xs; font-weight: $typography.weight-semibold; line-height: 1"><span data-slot="label"></span></span><span id="pin-chip" style="position: absolute; left: 8px; bottom: 8px; padding: $spacing.2xs $spacing.md; border-radius: $radius.pill; background: var(--chrome-accent); color: #ffffff; font-size: $typography.ui-2xs; font-weight: $typography.weight-semibold; line-height: 1.3">Whole screen</span></span></template>
