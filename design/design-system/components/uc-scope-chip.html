<span id="sc" style="display: inline-flex; align-items: center; height: $size.chip-h; padding: 0 $spacing.sm; border-radius: $radius.pill; background: var(--chrome-field); color: var(--chrome-text-secondary); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span data-slot="label"></span></span>
<template data-variant="element"><span id="sc" style="display: inline-flex; align-items: center; height: $size.chip-h; padding: 0 $spacing.sm; border-radius: $radius.pill; background: var(--chrome-accent-subtle); color: var(--chrome-accent); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span data-slot="label"></span></span></template>
<template data-variant="warning"><span id="sc" style="display: inline-flex; align-items: center; height: $size.chip-h; padding: 0 $spacing.sm; border-radius: $radius.pill; background: var(--chrome-warning-subtle); color: var(--chrome-warning); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span data-slot="label"></span></span></template>
<template data-variant="selected-element"><span id="sc" style="display: inline-flex; align-items: center; height: $size.chip-h; padding: 0 $spacing.sm; border-radius: $radius.pill; background: var(--chrome-raised); color: var(--chrome-accent); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span data-slot="label"></span></span></template>
<template data-variant="selected-warning"><span id="sc" style="display: inline-flex; align-items: center; height: $size.chip-h; padding: 0 $spacing.sm; border-radius: $radius.pill; background: var(--chrome-raised); color: var(--chrome-warning); font-size: $typography.ui-chip; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span data-slot="label"></span></span></template>
