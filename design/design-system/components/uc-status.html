<span id="st" style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 $spacing.md 0 7px; border-radius: $radius.pill; border: 1px dashed var(--chrome-border-strong); color: var(--chrome-text-secondary); font-size: $typography.ui-2xs; white-space: nowrap; flex: none"><span id="st-dot" style="width: 6px; height: 6px; border-radius: $radius.pill; border: 1.5px solid var(--chrome-text-tertiary)"></span>Draft</span>
<template data-variant="ready"><span id="st" style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 $spacing.md 0 7px; border-radius: $radius.pill; background: var(--chrome-accent-subtle); color: var(--chrome-accent); font-size: $typography.ui-2xs; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span id="st-dot" style="width: 7px; height: 7px; border-radius: $radius.pill; background: var(--chrome-accent)"></span>Ready</span></template>
<template data-variant="dot-draft"><span id="st" style="display: inline-block; width: 7px; height: 7px; flex: none; border-radius: $radius.pill; border: 1.5px solid var(--chrome-text-tertiary)" title="Draft"></span></template>
<template data-variant="dot-ready"><span id="st" style="display: inline-block; width: 7px; height: 7px; flex: none; border-radius: $radius.pill; background: var(--chrome-accent)" title="Ready"></span></template>
