<span id="vc" style="display: inline-flex; align-items: center; gap: $spacing.sm; height: $size.control; padding: 0 $spacing.pad; border-radius: $radius.sm; border: 1px solid var(--chrome-border); background: var(--chrome-raised); color: var(--chrome-text-secondary); font-size: $typography.ui-sm; white-space: nowrap; flex: none"><span id="vc-label"><span data-slot="label"></span></span><span id="vc-meta" style="font-size: $typography.ui-2xs; color: var(--chrome-text-tertiary)"><span data-slot="meta"></span></span></span>
<template data-variant="selected"><span id="vc" style="display: inline-flex; align-items: center; gap: $spacing.sm; height: $size.control; padding: 0 $spacing.pad; border-radius: $radius.sm; border: 1px solid var(--chrome-primary); background: var(--chrome-primary); color: var(--chrome-primary-text); font-size: $typography.ui-sm; font-weight: $typography.weight-medium; white-space: nowrap; flex: none"><span id="vc-label"><span data-slot="label"></span></span><span id="vc-meta" style="font-size: $typography.ui-2xs; font-weight: $typography.weight-regular; opacity: 0.7"><span data-slot="meta"></span></span></span></template>
<template data-variant="add"><span id="vc" style="display: inline-flex; align-items: center; gap: 4px; height: $size.control; padding: 0 $spacing.pad 0 $spacing.md; border-radius: $radius.sm; border: 1px dashed var(--chrome-border-strong); color: var(--chrome-text-tertiary); font-size: $typography.ui-sm; white-space: nowrap; flex: none"><span class="icon" style="font-size: $size.icon-sm; line-height: 1">add</span><span data-slot="label"></span></span></template>
