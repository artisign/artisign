<div id="zp" role="group" aria-label="Zoom" style="display:inline-flex;align-items:center;gap:$spacing.2xs;padding:$spacing.xs;border-radius:$radius.pill;background:var(--chrome-float);backdrop-filter:blur(10px);box-shadow:var(--chrome-shadow-card)"><span id="zp-out" data-component="float-icon-btn" aria-label="Zoom out"><span data-slot="icon">remove</span></span><output id="zp-value" style="width:46px;text-align:center;font-size:$typography.ui-base;font-weight:$typography.weight-semibold;color:var(--chrome-text)"><span data-slot="value"></span></output><span id="zp-in" data-component="float-icon-btn" aria-label="Zoom in"><span data-slot="icon">add</span></span><span id="zp-divider" style="width:1px;height:20px;margin:0 $spacing.xs;background:var(--chrome-border);flex:none"></span><button type="button" id="zp-fit" style="display:inline-flex;align-items:center;gap:$spacing.sm;height:$size.float-control;padding:0 $spacing.lg;border:0;border-radius:$radius.pill;background:none;color:var(--chrome-text-secondary);font:inherit;font-size:$typography.ui-base;font-weight:$typography.weight-medium;white-space:nowrap"><span class="icon" id="zp-fit-icon" style="font-size:$size.icon-sm;line-height:1">fit_screen</span><span data-slot="fit"></span></button></div>
