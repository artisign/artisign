<span id="zoom-slider" style="display: flex; align-items: center; gap: $spacing.sm">
  <span id="zs-minus" class="icon" style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--chrome-border-strong); border-radius: $radius.sm; background: var(--chrome-raised); color: var(--chrome-text); font-size: $size.icon-sm; line-height: 1">remove</span>
  <span id="zs-track" style="position: relative; width: 140px; height: 4px; border-radius: $radius.pill; background: var(--chrome-field)">
    <span id="zs-fill" style="position: absolute; left: 0; top: 0; height: 4px; border-radius: $radius.pill; background: var(--chrome-accent); width: 66px"></span>
    <span id="zs-thumb" style="position: absolute; top: 50%; left: 66px; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: $radius.pill; background: var(--chrome-accent); border: 2px solid var(--chrome-raised); box-shadow: var(--chrome-shadow-float)"></span>
  </span>
  <span id="zs-plus" class="icon" style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--chrome-border-strong); border-radius: $radius.sm; background: var(--chrome-raised); color: var(--chrome-text); font-size: $size.icon-sm; line-height: 1">add</span>
  <span id="zs-readout-wrap" style="font-size: $typography.ui-sm; color: var(--chrome-text); min-width: 36px"><span data-slot="readout">100%</span></span>
