<div id="app" data-title="Board view — empty state" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar" data-variant="board"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 280px; display: flex; flex-direction: column; min-height: 0"><div id="screens-header" style="gap: $spacing.md; padding: 10px $spacing.md; border-bottom: 1px solid $color.border; flex: none; display: flex; align-items: center"><span id="screens-title" style="font-size: $typography.size-sm; font-weight: $typography.weight-semibold; color: $color.text-secondary; flex: 1">Screens</span><span id="screens-collapse" style="padding: $spacing.xs; color: $color.text-faded; flex: none; line-height: 1">◂</span></div><div id="screens-body" style="flex: 1; min-height: 0; overflow-y: auto"><div id="screen-filter" style="padding: $spacing.lg $spacing.md; border-bottom: 1px solid $color.border"><div id="screen-filter-wrap" style="gap: $spacing.md; border: 1px solid $color.accent; border-radius: $radius.sm; background: $color.accent-subtle; display: flex; align-items: center; height: 32px; padding: 0 10px"><span id="screen-filter-icon" style="border: 1.5px solid $color.accent; border-radius: $radius.pill; flex: none; width: 11px; height: 11px"></span><span id="screen-filter-input" style="font-size: $typography.size-sm; color: $color.accent; font-weight: $typography.weight-semibold; flex: 1">xyzzy</span></div><div id="screen-filter-hint" style="margin-top: $spacing.sm; font-size: $typography.size-hint; color: $color.text-faint">0 matches</div></div><div id="screen-list-empty" style="padding: $spacing.2xl $spacing.lg; font-size: $typography.size-sm; color: $color.text-faint; text-align: center">No screens match.</div></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="board-tb" class="$board-toolbar"><span data-slot="status">0 shown — 0 matches · 0 pinned</span></div><div id="canvas" style="background: $color.canvas; flex: 1; overflow: auto; position: relative; display: flex; align-items: center; justify-content: center"><div id="empty-state" style="gap: $spacing.md; display: flex; flex-direction: column; align-items: center; max-width: 360px; text-align: center"><span id="empty-icon" style="color: $color.text-faint; font-size: 2rem">▤</span><div id="empty-title" style="font-size: $typography.size-lg; font-weight: $typography.weight-semibold; color: $color.text-secondary">No screens to show</div><div id="empty-body" style="font-size: $typography.size-base; color: $color.text-tertiary; line-height: 1.5">"xyzzy" matches nothing, and nothing is pinned. Clear the filter or pin a screen from the sidebar to bring it onto the board.</div></div></div></main></div></div>
