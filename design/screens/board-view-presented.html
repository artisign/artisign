<div id="app" data-title="Board view — presented by agent" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar" data-variant="board"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 36px; display: flex; flex-direction: column; min-height: 0"><div id="sidebar-screens-header" style="gap: $spacing.md; padding: $spacing.md 0; border-bottom: 1px solid $color.border; flex: none; display: flex; flex-direction: column; align-items: center"><span id="sidebar-screens-icon" style="color: $color.text-faded; font-size: 0.95rem">▤</span><span id="sidebar-screens-expand" style="padding: $spacing.xs; color: $color.text-faded; line-height: 1">▸</span></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="board-tb" class="$board-toolbar"><span data-slot="status">3 shown — 3 matches · 0 pinned</span></div><div id="canvas" style="background: $color.canvas; flex: 1; overflow: auto; position: relative; display: flex; align-items: stretch; justify-content: stretch"><div id="presented-banner" style="top: $spacing.lg; gap: $spacing.md; background: $color.accent-subtle; border: 1px solid $color.accent; border-radius: $radius.pill; padding: $spacing.sm $spacing.lg; box-shadow: $shadow.menu; position: absolute; left: 50%; transform: translateX(-50%); z-index: 1; display: flex; align-items: center"><span id="presented-icon" style="font-size: $typography.size-sm; color: $color.accent">◆</span><span id="presented-text" style="font-size: $typography.size-sm; color: $color.accent; font-weight: $typography.weight-semibold">Agent switched you here to show 3 screens</span><span id="presented-dismiss" style="color: $color.accent; font-size: $typography.size-sm; padding: 0 0 0 $spacing.xs; line-height: 1; cursor: pointer">✕</span></div><div id="board" style="position: relative; width: 100%; height: 100%"><div id="bc-1" style="position: absolute; left: 80px; top: 130px"><span id="bc-1-tile" class="$board-tile"><span data-slot="name">inspector-selected</span></span><span id="bc-1-pin" class="$pin-button" style="position: absolute; top: -8px; right: -8px"></span></div><div id="bc-2" style="position: absolute; left: 340px; top: 130px"><span id="bc-2-tile" class="$board-tile"><span data-slot="name">comments-panel</span></span><span id="bc-2-pin" class="$pin-button" style="position: absolute; top: -8px; right: -8px"></span></div><div id="bc-3" style="position: absolute; left: 600px; top: 130px"><span id="bc-3-tile" class="$board-tile"><span data-slot="name">design-system-view</span></span><span id="bc-3-pin" class="$pin-button" style="position: absolute; top: -8px; right: -8px"></span></div></div></div></main></div></div>
