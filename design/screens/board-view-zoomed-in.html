<div id="app" data-title="Board view — zoomed in, one screen" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar" data-variant="board"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 36px; display: flex; flex-direction: column; min-height: 0"><div id="sidebar-screens-header" style="gap: $spacing.md; padding: $spacing.md 0; border-bottom: 1px solid $color.border; flex: none; display: flex; flex-direction: column; align-items: center"><span id="sidebar-screens-icon" style="color: $color.text-faded; font-size: 0.95rem">▤</span><span id="sidebar-screens-expand" style="padding: $spacing.xs; color: $color.text-faded; line-height: 1">▸</span></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="board-tb" class="$board-toolbar" data-variant="zoomedin"><span data-slot="status">1 shown — 1 match · 0 pinned</span></div><div id="canvas" style="background: $color.canvas; flex: 1; overflow: auto; position: relative; display: flex; align-items: center; justify-content: center"><div id="bc-1" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.md; box-shadow: $shadow.menu; width: 640px; overflow: visible; position: relative"><div id="bc-1-inner" style="border-radius: $radius.md; overflow: hidden"><div id="bc-1-thumb" style="background: $color.surface-subtle; border-bottom: 1px solid $color.border; color: $color.text-faint; font-size: $typography.size-sm; height: 420px; display: flex; align-items: center; justify-content: center">app-shell preview</div><div id="bc-1-name" style="padding: $spacing.lg $spacing.xl; font-size: $typography.size-md; font-weight: $typography.weight-semibold; color: $color.text-secondary">app-shell</div></div><span id="bc-1-pin" class="$pin-button" style="position: absolute; top: -10px; right: -10px; width: 28px; height: 28px"></span></div></div></main></div></div>
