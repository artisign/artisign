<div id="app" data-title="Board view — screens on a canvas" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar" data-variant="board"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 36px; display: flex; flex-direction: column; min-height: 0"><div id="sidebar-screens-header" style="gap: $spacing.md; padding: $spacing.md 0; border-bottom: 1px solid $color.border; flex: none; display: flex; flex-direction: column; align-items: center"><span id="sidebar-screens-icon" style="color: $color.text-faded; font-size: 0.95rem">▤</span><span id="sidebar-screens-expand" style="padding: $spacing.xs; color: $color.text-faded; line-height: 1">▸</span></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="canvas" style="background: $color.canvas; flex: 1; overflow: auto; display: flex; align-items: stretch; justify-content: stretch"><div id="board" style="position: relative; width: 100%; height: 100%"><div id="bc-1" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.sm; box-shadow: $shadow.menu; position: absolute; left: 80px; top: 60px; width: 180px; overflow: hidden"><div id="bc-1-thumb" style="background: $color.surface-subtle; border-bottom: 1px solid $color.border; height: 120px"></div><div id="bc-1-name" style="padding: $spacing.md 10px; font-size: $typography.size-xs; color: $color.text-secondary">app-shell</div></div><div id="bc-2" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.sm; box-shadow: $shadow.menu; position: absolute; left: 340px; top: 60px; width: 180px; overflow: hidden"><div id="bc-2-thumb" style="background: $color.surface-subtle; border-bottom: 1px solid $color.border; height: 120px"></div><div id="bc-2-name" style="padding: $spacing.md 10px; font-size: $typography.size-xs; color: $color.text-secondary">inspector-selected</div></div><div id="bc-3" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.sm; box-shadow: $shadow.menu; position: absolute; left: 600px; top: 60px; width: 180px; overflow: hidden"><div id="bc-3-thumb" style="background: $color.surface-subtle; border-bottom: 1px solid $color.border; height: 120px"></div><div id="bc-3-name" style="padding: $spacing.md 10px; font-size: $typography.size-xs; color: $color.text-secondary">open-project-dialog</div></div><div id="bc-4" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.sm; box-shadow: $shadow.menu; position: absolute; left: 210px; top: 300px; width: 180px; overflow: hidden"><div id="bc-4-thumb" style="background: $color.surface-subtle; border-bottom: 1px solid $color.border; height: 120px"></div><div id="bc-4-name" style="padding: $spacing.md 10px; font-size: $typography.size-xs; color: $color.text-secondary">no-project-empty-state</div></div><div id="bc-5" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.sm; box-shadow: $shadow.menu; position: absolute; left: 470px; top: 300px; width: 180px; overflow: hidden"><div id="bc-5-thumb" style="background: $color.surface-subtle; border-bottom: 1px solid $color.border; height: 120px"></div><div id="bc-5-name" style="padding: $spacing.md 10px; font-size: $typography.size-xs; color: $color.text-secondary">board-view</div></div></div></div></main></div></div>
