<div id="app" data-title="Follow mode — following, whole-screen write highlight, activity feed" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar" data-variant="follow"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 36px; display: flex; flex-direction: column; min-height: 0"><div id="sidebar-screens-header" style="gap: $spacing.md; padding: $spacing.md 0; border-bottom: 1px solid $color.border; flex: none; display: flex; flex-direction: column; align-items: center"><span id="sidebar-screens-icon" style="color: $color.text-faded; font-size: 0.95rem">▤</span><span id="sidebar-screens-expand" style="padding: $spacing.xs; color: $color.text-faded; line-height: 1">▸</span></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="canvas" style="background: $color.canvas; flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center"><div id="screen-frame-wrap" style="position: relative"><div id="screen-frame" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.md; box-shadow: $shadow.menu; width: 390px; height: 640px; display: flex; flex-direction: column; overflow: hidden"><div id="frame-bar" style="padding: $spacing.lg $spacing.xl; border-bottom: 1px solid $color.border; font-size: $typography.size-base; font-weight: $typography.weight-semibold; color: $color.text; flex: none">Your cart</div><div id="frame-body" style="padding: $spacing.xl; gap: $spacing.lg; flex: 1; display: flex; flex-direction: column"><div id="line-1" style="border-radius: $radius.sm; background: $color.surface-subtle; border: 1px solid $color.border; height: 56px"></div><div id="line-2" style="border-radius: $radius.sm; background: $color.surface-subtle; border: 1px solid $color.border; height: 56px"></div><div id="line-3" style="border-radius: $radius.sm; background: $color.surface-subtle; border: 1px solid $color.border; height: 56px"></div></div></div><div id="write-screen-highlight" style="border: 3px dashed $color.activity-write; position: absolute; inset: -6px; border-radius: 16px; pointer-events: none; box-sizing: border-box"></div><span id="write-screen-badge" style="background: $color.activity-write; color: $color.surface; font-size: $typography.size-2xs; font-weight: $typography.weight-semibold; padding: 3px $spacing.md; border-radius: $radius.pill; box-shadow: $shadow.menu; position: absolute; top: -14px; right: 12px">Updated</span></div></div></main><aside id="feed" style="border-left: 1px solid $color.border; background: $color.surface; flex: none; width: 280px; display: flex; flex-direction: column; min-height: 0"><div id="feed-header" style="gap: $spacing.md; padding: 10px $spacing.md; border-bottom: 1px solid $color.border; flex: none"><span id="feed-tabs" class="$panel-tabs" data-variant="activity"></span></div><div id="feed-body" style="flex: 1; min-height: 0; overflow-y: auto"><div id="fe-1" class="$activity-entry" data-variant="write"><span data-slot="tool">write_html</span><span data-slot="target">screen · checkout-cart</span><span data-slot="time">just now</span></div><div id="fe-2" class="$activity-entry"><span data-slot="tool">get_screenshot</span><span data-slot="target">screen · checkout-cart</span><span data-slot="time">1s ago</span></div><div id="fe-3" class="$activity-entry"><span data-slot="tool">get_screen</span><span data-slot="target">screen · checkout-cart</span><span data-slot="time">4s ago</span></div><div id="fe-4" class="$activity-entry" data-variant="write"><span data-slot="tool">set_meta</span><span data-slot="target">screen · checkout-cart</span><span data-slot="time">6s ago</span></div><div id="fe-5" class="$activity-entry" data-variant="error"><span data-slot="tool">patch_html</span><span data-slot="target">screen · checkout-cart · line-4</span><span data-slot="time">11s ago</span></div><div id="fe-6" class="$activity-entry" data-variant="deleted"><span data-slot="tool">inspect_node</span><span data-slot="time">40s ago</span></div><div id="fe-7" class="$activity-entry"><span data-slot="tool">find_nodes</span><span data-slot="target">project-wide</span><span data-slot="time">52s ago</span></div></div></aside></div></div>
