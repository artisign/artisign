<div id="app" data-title="Activity feed — empty state" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 36px; display: flex; flex-direction: column; min-height: 0"><div id="sidebar-screens-header" style="gap: $spacing.md; padding: $spacing.md 0; border-bottom: 1px solid $color.border; flex: none; display: flex; flex-direction: column; align-items: center"><span id="sidebar-screens-icon" style="color: $color.text-faded; font-size: 0.95rem">▤</span><span id="sidebar-screens-expand" style="padding: $spacing.xs; color: $color.text-faded; line-height: 1">▸</span></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="canvas" style="background: $color.canvas; flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center"><div id="screen-frame" style="background: $color.surface; border: 1px solid $color.border-strong; border-radius: $radius.md; box-shadow: $shadow.menu; width: 390px; height: 640px; display: flex; flex-direction: column; overflow: hidden"><div id="frame-bar" style="padding: $spacing.lg $spacing.xl; border-bottom: 1px solid $color.border; font-size: $typography.size-base; font-weight: $typography.weight-semibold; color: $color.text; flex: none">Your cart</div><div id="frame-body" style="padding: $spacing.xl; gap: $spacing.lg; flex: 1; display: flex; flex-direction: column"><div id="line-1" style="border-radius: $radius.sm; background: $color.surface-subtle; border: 1px solid $color.border; height: 56px"></div><div id="line-2" style="border-radius: $radius.sm; background: $color.surface-subtle; border: 1px solid $color.border; height: 56px"></div><div id="line-3" style="border-radius: $radius.sm; background: $color.surface-subtle; border: 1px solid $color.border; height: 56px"></div></div></div></div></main><aside id="feed" style="border-left: 1px solid $color.border; background: $color.surface; flex: none; width: 280px; display: flex; flex-direction: column; min-height: 0"><div id="feed-header" style="gap: $spacing.md; padding: 10px $spacing.md; border-bottom: 1px solid $color.border; flex: none"><span id="feed-tabs" class="$panel-tabs" data-variant="activity"></span></div><div id="feed-body" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; align-items: center; justify-content: center"><p id="feed-empty" style="padding: 0 $spacing.xl; font-size: $typography.size-sm; color: $color.text-faint; margin: 0; text-align: center">No agent activity yet this session.</p></div></aside></div></div>
