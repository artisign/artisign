<div id="app" data-title="Follow mode — highlights on a dark screen" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar" data-variant="follow"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 36px; display: flex; flex-direction: column; min-height: 0"><div id="sidebar-screens-header" style="gap: $spacing.md; padding: $spacing.md 0; border-bottom: 1px solid $color.border; flex: none; display: flex; flex-direction: column; align-items: center"><span id="sidebar-screens-icon" style="color: $color.text-faded; font-size: 0.95rem">▤</span><span id="sidebar-screens-expand" style="padding: $spacing.xs; color: $color.text-faded; line-height: 1">▸</span></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="canvas" style="background: $color.canvas; flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center"><div id="screen-frame" style="border: 1px solid $color.border-strong; border-radius: $radius.md; box-shadow: $shadow.menu; background: #14151a; width: 390px; height: 640px; display: flex; flex-direction: column; overflow: hidden"><div id="frame-bar" style="padding: $spacing.lg $spacing.xl; font-size: $typography.size-base; font-weight: $typography.weight-semibold; border-bottom: 1px solid #2a2c35; color: #f2f2f5; flex: none">Dashboard</div><div id="frame-body" style="padding: $spacing.xl; gap: $spacing.lg; flex: 1; display: flex; flex-direction: column"><div id="card-1" style="border-radius: $radius.sm; border: 2px solid $color.activity-read; background: #1f2029; height: 90px"></div><div id="card-2" style="border-radius: $radius.sm; background: alpha($color.activity-write, 0.15); border: 2px dashed $color.activity-write; height: 90px"></div><div id="card-3" style="border-radius: $radius.sm; background: #1f2029; border: 1px solid #2a2c35; height: 90px"></div></div></div></div></main><aside id="feed" style="border-left: 1px solid $color.border; background: $color.surface; flex: none; width: 280px; display: flex; flex-direction: column; min-height: 0"><div id="feed-header" style="gap: $spacing.md; padding: 10px $spacing.md; border-bottom: 1px solid $color.border; flex: none"><span id="feed-tabs" class="$panel-tabs" data-variant="activity"></span></div><div id="feed-body" style="flex: 1; min-height: 0; overflow-y: auto"><div id="fe-1" class="$activity-entry"><span data-slot="tool">get_screenshot</span><span data-slot="target">screen · dashboard-dark · card-1</span><span data-slot="time">just now</span></div><div id="fe-2" class="$activity-entry" data-variant="write"><span data-slot="tool">write_html</span><span data-slot="target">screen · dashboard-dark · card-2</span><span data-slot="time">2s ago</span></div></div></aside></div></div>
