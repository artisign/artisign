<div id="app" data-title="Follow mode — component/pattern target highlighted in Design System view" style="font-family: $typography.family; color: $color.text; background: $color.surface; position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column"><div id="bar" class="$topbar" data-variant="follow"></div><div id="body" style="flex: 1; display: flex; min-height: 0"><aside id="sidebar-screens" style="border-right: 1px solid $color.border; background: $color.surface; flex: none; width: 36px; display: flex; flex-direction: column; min-height: 0"><div id="sidebar-screens-header" style="gap: $spacing.md; padding: $spacing.md 0; border-bottom: 1px solid $color.border; flex: none; display: flex; flex-direction: column; align-items: center"><span id="sidebar-screens-icon" style="color: $color.text-faded; font-size: 0.95rem">▤</span><span id="sidebar-screens-expand" style="padding: $spacing.xs; color: $color.text-faded; line-height: 1">▸</span></div></aside><main id="main" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div id="canvas" style="background: $color.surface-subtle; flex: 1; overflow: auto; display: flex; align-items: stretch; justify-content: stretch"><div id="ds-scroll" style="padding: $spacing.2xl; width: 100%; height: 100%; overflow-y: auto"><div id="ds-inner" style="max-width: 760px; margin: 0 auto"><div id="ds-components" style="background: $color.surface; border: 1px solid $color.border; border-radius: $radius.md; padding: $spacing.2xl; margin-bottom: $spacing.xl"><h3 id="ds-components-title" style="margin: 0 0 $spacing.lg; font-size: $typography.size-lg; font-weight: $typography.weight-semibold; color: $color.text">Components</h3><div id="ds-comp-row" style="gap: $spacing.md; display: flex; flex-wrap: wrap; align-items: center"><span id="ds-chip-1" class="$tag-chip"><span data-slot="label">shell</span></span><span id="ds-chip-2" class="$tag-chip"><span data-slot="label">dialog</span></span><span id="ds-chip-3-wrap" style="position: relative; display: inline-flex"><span id="ds-chip-3" class="$tag-chip" data-variant="active"><span data-slot="label">active</span></span><span id="ds-chip-3-highlight" style="border-radius: $radius.pill; border: 2px dashed $color.activity-write; background: alpha($color.activity-write, 0.08); position: absolute; inset: -5px; pointer-events: none"></span></span></div><p id="ds-comp-note" style="margin: $spacing.lg 0 0; font-size: $typography.size-xs; color: $color.text-tertiary">$tag-chip · one slot, two roles: screen tags and the mockup badge.</p></div></div></div></div></main><aside id="feed" style="border-left: 1px solid $color.border; background: $color.surface; flex: none; width: 280px; display: flex; flex-direction: column; min-height: 0"><div id="feed-header" style="gap: $spacing.md; padding: 10px $spacing.md; border-bottom: 1px solid $color.border; flex: none"><span id="feed-tabs" class="$panel-tabs" data-variant="activity"></span></div><div id="feed-body" style="flex: 1; min-height: 0; overflow-y: auto"><div id="fe-1" class="$activity-entry" data-variant="write"><span data-slot="tool">promote_to_system</span><span data-slot="target">component · tag-chip#active</span><span data-slot="time">just now</span></div></div></aside></div></div>
