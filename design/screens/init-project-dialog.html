e="flex: 1">artisign</span></div><div id="id-r1" style="gap: $spacing.md; padding: $spacing.md $spacing.lg; font-size: $typography.size-sm; color: $color.text-secondary; display: flex; align-items: center; background: transparent"><span id="id-r1-icon" style="color: $color.text-faded">▸</span><span id="id-r1-name" style="flex: 1">notes-app</span><span id="id-r1-badge" class="$tag-chip" data-variant="badge"><span data-slot="label">project</span></span></div><div id="id-r2" style="gap: $spacing.md; padding: $spacing.md $spacing.lg; font-size: $typography.size-sm; color: $color.accent; background: $color.accent-subtle; display: flex; align-items: center"><span id="id-r2-icon" style="color: $color.text-faded">▸</span><span id="id-r2-name" style="flex: 1">portfolio</span></div><div id="id-r3" style="gap: $spacing.md; padding: $spacing.md $spacing.lg; font-size: $typography.size-sm; color: $color.text-secondary; display: flex; align-items: center; background: transparent"><span id="id-r3-icon" style="color: $color.text-faded">▸</span><span id="id-r3-name" style="flex: 1">scratch</span></div></div><div id="init-dialog-field" style="gap: $spacing.sm; display: flex; flex-direction: column"><span id="init-dialog-label" style="font-size: $typography.size-sm; color: $color.text-secondary">New folder / project name</span><span id="init-dialog-input" style="border: 1px solid $color.border-strong; border-radius: $radius.sm; background: $color.surface-subtle; font-size: $typography.size-sm; color: $color.text-faint; height: 32px; display: flex; align-items: center; padding: 0 10px">my-new-project</span></div><p id="init-dialog-hint" style="font-size: $typography.size-sm; color: $color.text-label; margin: 0">Will create: ~/Workspace/portfolio/my-new-project</p><div id="init-dialog-actions" style="gap: $spacing.md; display: flex; justify-content: flex-end"><span id="init-dialog-cancel" class="$btn"><span data-slot="label">Cancel</span></span><span id="init-dialog-confirm" class="$btn
